[package]
name = "weather-app"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = "0.4"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }

[profile.release]
opt-level = 3
strip = true
